name: Continuum World Phase 1
on:
  pull_request:
    branches: [main]
    paths:
      - 'continuum-world*'
      - 'WorldConversation.jsx'
      - 'WorldProgress.jsx'
      - 'WorldLearningEvidence.jsx'
      - 'speaking-api.mjs'
      - 'speaking-ai.mjs'
      - 'scripts/qa-continuum-world-phase2.mjs'
      - 'public/world-tokyo/**'
      - 'ContinuumWorld.jsx'
      - 'PracticeStudio.jsx'
      - 'server.mjs'
      - 'native-policy.mjs'
      - 'scripts/build-world-people.py'
      - 'scripts/qa-continuum-world.mjs'
      - 'scripts/qa-continuum-world-entry.mjs'
      - 'scripts/qa-continuum-world-visuals.mjs'
      - 'scripts/qa-continuum-world-gait.mjs'
      - '.github/workflows/continuum-world.yml'
permissions:
  contents: read
concurrency:
  group: continuum-world-${{ github.ref }}
  cancel-in-progress: true
jobs:
  world:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      - run: node --test continuum-world-model.test.mjs continuum-world-audio.test.mjs continuum-world-visuals.test.mjs continuum-world-people.test.mjs interface-templates.test.mjs native-policy.test.mjs
      - run: npx playwright install --with-deps chromium webkit
      - run: node scripts/qa-continuum-world.mjs
      - run: VITE_CONTINUUM_WORLD_TOKYO_BETA=true npm run build && node scripts/qa-continuum-world-entry.mjs
      - run: npm run ios:sync && npm run test:native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: continuum-world-phase1-evidence
          path: |
            .media-build/continuum-world/*.png
            .media-build/continuum-world/results.json
          if-no-files-found: ignore

  art:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: QA_WORLD_VISUAL_SHOTS=cafe,cafe-entry,cafe-counter,block-day,market node scripts/qa-continuum-world-visuals.mjs && node scripts/qa-continuum-world-gait.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: continuum-world-art-preview
          retention-days: 7
          path: |
            .media-build/continuum-world-art/1280-cafe*.png
            .media-build/continuum-world-art/390-cafe*.png
            .media-build/continuum-world-art/1280-block-day.png
            .media-build/continuum-world-art/390-block-day.png
            .media-build/continuum-world-art/390-station-day.png
            .media-build/continuum-world-art/1280-station-platform.png
            .media-build/continuum-world-art/1280-walking.png
            .media-build/continuum-world-art/1280-running.png
            .media-build/continuum-world-art/running-cycle.png
            .media-build/continuum-world-art/1280-market.png
            .media-build/continuum-world-art/390-market.png
            .media-build/continuum-world-art/1280-market-counter.png
            .media-build/continuum-world-art/1280-market-aisle.png
            .media-build/continuum-world-art/390-market-front.png
            .media-build/continuum-world-art/390-block-night.png
            .media-build/continuum-world-art/1280-street-materials.png
            .media-build/continuum-world-art/results.json
          if-no-files-found: ignore
      - run: node scripts/qa-continuum-world-visuals.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: continuum-world-art-evidence
          path: |
            .media-build/continuum-world-art/*.png
            .media-build/continuum-world-art/results.json
          if-no-files-found: ignore

  phase2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: node scripts/qa-continuum-world-phase2.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: continuum-world-phase2-evidence
          path: |
            .media-build/world-phase2/*.png
            .media-build/world-phase2/results.json
          if-no-files-found: ignore
