name: Build additional display-language copy
on:
  push:
    branches: [feat/four-new-display-languages]
    paths:
      - '.github/workflows/expand-display-languages.yml'
      - 'scripts/build-display-translations.mjs'
      - 'translation-guidance.mjs'
      - 'display-language-seed.mjs'
permissions:
  contents: read
concurrency:
  group: additional-display-copy
  cancel-in-progress: false
jobs:
  translate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        locale: [ko, id, ru, ar]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Translate public interface catalog
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_TRANSLATION_MODEL: gpt-4o-mini
        run: node scripts/build-display-translations.mjs ${{ matrix.locale }}
      - uses: actions/upload-artifact@v4
        with:
          name: display-copy-${{ matrix.locale }}
          path: display-copy-${{ matrix.locale }}.json
          retention-days: 3
  bundle:
    needs: translate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/four-new-display-languages
      - uses: actions/download-artifact@v4
        with:
          pattern: display-copy-*
          merge-multiple: true
      - name: Assemble complete offline catalog
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const result={};let expected;
          for(const locale of ['ko','id','ru','ar']){
            const copy=JSON.parse(fs.readFileSync('display-copy-'+locale+'.json'));
            const keys=Object.keys(copy).sort();
            if(expected&&JSON.stringify(keys)!==JSON.stringify(expected))throw Error('Locale coverage mismatch');
            expected=keys;
            for(const [source,text] of Object.entries(copy)){if(typeof text!=='string'||!text.trim())throw Error('Empty translation');(result[source]??={})[locale]=text;}
          }
          fs.writeFileSync('additional-display-copy.json',JSON.stringify(Object.fromEntries(Object.entries(result).sort()),null,2)+'\n');
          console.log('Bundled '+expected.length+' phrases in four languages.');
          JS
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add additional-display-copy.json
          git diff --cached --quiet || git commit -m 'Bundle Korean, Indonesian, Russian and Arabic interface translations'
          git push origin HEAD:feat/four-new-display-languages
