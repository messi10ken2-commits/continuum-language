name: Native fixture diagnostics
on:
  push:
    branches: ['qa/ios-readiness-ui']
permissions:
  contents: read
  actions: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: continuum-ios-launch
          run-id: 44244073905
          github-token: ${{ github.token }}
          path: /tmp/prior-native
      - name: Read synthetic backend trace
        run: |
          find /tmp/prior-native -name continuum-ios-backend.log -exec cat {} \;
          find /tmp/prior-native -name continuum-ios-test-summary.json -exec cat {} \;
