name: Test social automation changes
on:
  pull_request:
    paths:
      - 'social_automation/**'
      - '.github/workflows/social-autopost.yml'
      - '.github/workflows/social-automation-tests.yml'

permissions:
  contents: read

jobs:
  offline-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test social posting and five-language rotation (no API calls)
        run: python -m unittest discover -s social_automation -p 'test_*.py' -v
