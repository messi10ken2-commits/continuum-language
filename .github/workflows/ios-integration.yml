name: iOS integration
on:
  push:
    branches: ['codex/ios-integration']
    paths-ignore: ['docs/**']
permissions:
  contents: read
concurrency:
  group: ios-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-build:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      - run: npm run ios:sync
      - run: npm run ios:check
      - name: Build unsigned simulator application
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/continuum-ios CODE_SIGNING_ALLOWED=NO build
      - name: Preserve development simulator build
        run: tar -czf /tmp/continuum-ios-development.tar.gz -C /tmp/continuum-ios/Build/Products/Debug-iphonesimulator App.app
      - name: Launch in iPhone simulator
        timeout-minutes: 8
        run: |
          xcrun simctl list devices available -j > /tmp/continuum-simulators.json
          IOS_SIMULATOR_ID=$(python3 -c 'import json; d=json.load(open("/tmp/continuum-simulators.json")); runtimes=sorted(d["devices"],key=lambda key: tuple(int(n) for n in key.rsplit("iOS-",1)[-1].split("-") if n.isdigit()),reverse=True); print(next(x["udid"] for key in runtimes for x in d["devices"][key] if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$IOS_SIMULATOR_ID"
          xcrun simctl bootstatus "$IOS_SIMULATOR_ID" -b
          printf 'IOS_SIMULATOR_ID=%s\n' "$IOS_SIMULATOR_ID" >> "$GITHUB_ENV"
          xcrun simctl install "$IOS_SIMULATOR_ID" /tmp/continuum-ios/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch "$IOS_SIMULATOR_ID" com.continuum.language.dev
          sleep 12
          xcrun simctl io "$IOS_SIMULATOR_ID" screenshot /tmp/continuum-ios-launch.png
      - name: Start isolated HTTPS backend and trust test certificate
        run: |
          npm run build
          IOS_OPENSSL_BIN="$(brew --prefix openssl@3)/bin/openssl"
          "$IOS_OPENSSL_BIN" req -x509 -newkey rsa:2048 -nodes -keyout /tmp/continuum-root.key -out /tmp/continuum-root.crt -days 1 -subj '/CN=Continuum CI Root' -addext 'basicConstraints=critical,CA:TRUE'
          "$IOS_OPENSSL_BIN" req -newkey rsa:2048 -nodes -keyout /tmp/continuum-test.key -out /tmp/continuum-test.csr -subj '/CN=127.0.0.1'
          printf 'subjectAltName=IP:127.0.0.1,DNS:localhost\nextendedKeyUsage=serverAuth\nbasicConstraints=CA:FALSE\n' > /tmp/continuum-test.ext
          "$IOS_OPENSSL_BIN" x509 -req -in /tmp/continuum-test.csr -CA /tmp/continuum-root.crt -CAkey /tmp/continuum-root.key -CAcreateserial -out /tmp/continuum-test.crt -days 1 -extfile /tmp/continuum-test.ext
          xcrun simctl keychain "$IOS_SIMULATOR_ID" add-root-cert /tmp/continuum-root.crt
          node scripts/ios-test-backend.mjs > /tmp/continuum-ios-backend.log 2>&1 &
          printf '%s' "$!" > /tmp/continuum-ios-backend.pid
          for attempt in $(seq 1 60); do
            if test -f /tmp/continuum-ios-backend-ready; then break; fi
            sleep 1
          done
          curl --fail --cacert /tmp/continuum-root.crt https://127.0.0.1:9443/api/health
      - name: Verify native login, Keychain persistence and logout
        env:
          CONTINUUM_API_ORIGIN: https://127.0.0.1:9443
        run: |
          npm run ios:sync
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID" -derivedDataPath /tmp/continuum-ios-e2e -resultBundlePath /tmp/continuum-ios-e2e.xcresult CODE_SIGNING_ALLOWED=NO test
      - name: Stop isolated backend
        if: always()
        run: if test -f /tmp/continuum-ios-backend.pid; then kill "$(cat /tmp/continuum-ios-backend.pid)" || true; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: continuum-ios-launch
          path: |
            /tmp/continuum-ios-launch.png
            /tmp/continuum-ios-e2e.xcresult
            /tmp/continuum-ios-backend.log
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: continuum-ios-simulator
          path: /tmp/continuum-ios-development.tar.gz
  shared-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:qa
      - run: npm run build:native
