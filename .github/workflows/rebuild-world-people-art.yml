name: Rebuild Tokyo people art
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/build-world-people.py'
      - '.github/workflows/rebuild-world-people-art.yml'
permissions:
  contents: read
jobs:
  rebuild:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/tokyo-world-art-polish'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Rebuild from verified CC0 source
        run: |
          curl -fLsS --retry 2 --connect-timeout 15 --max-time 180 'https://github.com/WaviestSun/atelier-packs/releases/download/packs-2/Universal-Base-Characters-Standard.zip' -o "$RUNNER_TEMP/world-base-characters.zip"
          python3 scripts/build-world-people.py "$RUNNER_TEMP/world-base-characters.zip"
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('public/world-tokyo/people/manifest.json').read_text())
          expected={'traveller':'f80bd77305073618d614ae5088320254d1b18755aa03154dc0346d902aa3a214','resident':'78aed4a9b561d4ba95aafa667da7c66e637a83651acf6db1c6e01d917182219f'}
          assert all(f['sha256']==expected[f['name']] for f in manifest['files'])
          print('Both rebuilt model hashes match the visually verified refinement')
          PY
      - name: Save generated art only to its existing work branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/world-tokyo/people/traveller.glb public/world-tokyo/people/resident.glb public/world-tokyo/people/manifest.json continuum-world-people-assets.mjs
          if git diff --cached --quiet; then
            echo "Generated art is already current"
          else
            git commit -m "Regenerate verified Tokyo people garments and neck geometry"
            git push origin HEAD:refs/heads/codex/tokyo-world-art-polish
          fi
