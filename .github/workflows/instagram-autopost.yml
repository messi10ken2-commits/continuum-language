name: Continuum Instagram Visual Autopost

on:
  schedule:
    # Redundant checks at 02:17, 08:17, 14:17 and 20:17 Malaysia time
    - cron: '17 0,6,12,18 * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/instagram-autopost.yml', 'social_automation/instagram_poster.py']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Generate a local visual preview without scheduling'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: continuum-instagram-visuals
  cancel-in-progress: false

jobs:
  visual-posts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PNG renderer
        run: python -m pip install 'CairoSVG>=2.7,<3'
      - name: Test Instagram scheduling and image logic
        run: python -m unittest social_automation.test_instagram_poster -v
      - name: Create images, generate captions and schedule Instagram posts
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          INSTAGRAM_CHANNEL_ID: ${{ vars.INSTAGRAM_CHANNEL_ID }}
          SOCIAL_AUTOPUBLISH_ENABLED: ${{ vars.SOCIAL_AUTOPUBLISH_ENABLED }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            python -m social_automation.instagram_poster --dry-run
          else
            python -m social_automation.instagram_poster
          fi
