name: Tokyo art iteration
on:
  push:
    branches: [codex/tokyo-authenticity]
permissions:
  contents: read
concurrency:
  group: tokyo-art-iteration
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: tar -C ~/.cache/ms-playwright -czf /tmp/world-browser.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: world-render-browser
          retention-days: 1
          path: /tmp/world-browser.tgz
      - run: QA_WORLD_VISUAL_SHOTS=street-day,street-night,block-day,block-night,walking QA_WORLD_VISUAL_WIDTHS=1280,390 node scripts/qa-continuum-world-visuals.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tokyo-iteration
          retention-days: 3
          path: |
            .media-build/continuum-world-art/*.png
            .media-build/continuum-world-art/results.json
