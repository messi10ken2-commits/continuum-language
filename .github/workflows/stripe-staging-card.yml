name: Stripe Staging Test Card and Webhook QA
on:
  pull_request:
    paths:
      - 'scripts/qa-stripe-staging-card.mjs'
      - '.github/workflows/stripe-staging-card.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staging-card-trial:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install test browser without app postinstall
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Verify Stripe SANDBOX card, trial, webhook and cancellation
        run: node scripts/qa-stripe-staging-card.mjs
