name: Validate application
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'security/**']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm run check:runtime
      - run: npm ci
      - run: npm run test:qa
      - run: npm run build
      - run: npm audit --omit=dev
      - name: Build production image
        run: docker build --tag continuum-security-check .
      - name: Verify production runtime and unprivileged user
        run: |
          docker run --rm continuum-security-check node scripts/check-runtime.mjs
          test "$(docker run --rm continuum-security-check id -u)" != "0"
