name: Validate application
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'security/**']
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    needs: [immersion, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm run check:runtime
      - run: npm ci
      - run: npm run build
      - run: node scripts/audit-expanded-bundle.mjs
      - name: Install browser QA runtime
        run: |
          npx playwright install --with-deps chromium webkit
      - name: Verify Light motion, interactions and accessibility
        run: node scripts/qa-light-motion.mjs
      - name: Verify audio recovery in Chromium and WebKit
        run: node scripts/qa-country-worlds.mjs && node scripts/qa-speaking-feedback.mjs && node scripts/qa-audio-recovery.mjs && node scripts/qa-reference-audio.mjs && node scripts/qa-complete-lesson-audio.mjs && node scripts/qa-conversation-natural.mjs && node scripts/qa-communication-review.mjs
      - name: Verify six languages in both layouts on phone and desktop
        run: node scripts/qa-six-languages.mjs && node scripts/qa-six-language-app.mjs && node scripts/qa-language-records.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: six-language-browser-evidence
          path: |
            .media-build/six-languages
            .media-build/language-records
          if-no-files-found: ignore
      - run: npm run audit:language
      - run: npm audit --omit=dev
      - name: Build production image
        run: docker build --tag continuum-security-check .
      - name: Verify production runtime and unprivileged user
        run: |
          docker run --rm continuum-security-check node scripts/check-runtime.mjs
          test "$(docker run --rm continuum-security-check id -u)" != "0"

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm run check:runtime
      - run: npm ci
      - run: npm run build
      - run: npm run test:qa

  immersion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      - name: Verify authored curriculum and deterministic metadata
        run: |
          node scripts/audit-immersive-content.mjs
          node scripts/build-immersive-canonical.mjs
          node scripts/build-immersive-catalog.mjs
          git diff --exit-code -- immersive/canonical.json immersive/catalog.json
      - run: npx playwright install --with-deps chromium webkit
      - name: Verify real 3D lifecycle and integrated immersion lessons
        run: node scripts/qa-companion-3d.mjs && node scripts/qa-immersive.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: immersive-browser-evidence
          path: |
            .media-build/immersive/*.png
            .media-build/immersive-ui/*.png
            .media-build/immersive-ui/*.txt
          if-no-files-found: ignore
