name: Validate application
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --test response-performance.test.mjs localization.test.mjs localization-api.test.mjs localization-render.test.mjs learning-text-protection.test.mjs speech.test.mjs sentence-audio.test.mjs
      - run: npm run build
