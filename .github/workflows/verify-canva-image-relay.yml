name: Verify Canva media relay
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-canva-image-relay.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  relay-test:
    runs-on: ubuntu-latest
    steps:
      - name: Try Canva original resolution relay
        env:
          MEDIA_URL: 'https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F7dc4c6d8-6c34-419c-8b5f-a58c6cf87589/watermark:F/width:160?csig=AAAAAAAAAAAAAAAAAAAAAHy-9ROYx0yYZ231waT49mo2lxPRW41mwKxRBjBs9Bes&exp=1793305035&osig=AAAAAAAAAAAAAAAAAAAAAMKmmek6XQSnNmIiNAhE2fupWuQcL14L1Pg4BNi8MEkS&signer=media-rpc&token=AAIAAU0AJDdkYzRjNmQ4LTZjMzQtNDE5Yy04YjVmLWE1OGM2Y2Y4NzU4OQAAAAABoYlPQPi8VwtgrVDNAuiKn6pjk9UZUtRsKZGikbF5dFM2S-6rdg&x-canva-quality=thumbnail'
        run: |
          python - <<'PY'
          import os,urllib.request,urllib.error,io
          from urllib.parse import urlparse
          url=os.environ['MEDIA_URL']
          variants={'thumbnail':url,'original':url.replace('height:200','height:1402').replace('width:160','width:1122')}
          for k,u in variants.items():
           try:
            with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=20) as r:
             b=r.read()
             print(k,'http',r.status,'bytes',len(b),'first_bytes',b[:8].hex(),flush=True)
           except Exception as e: print(k,'ERROR',str(e)[:180],flush=True)
          PY
