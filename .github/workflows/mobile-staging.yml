name: Build mobile staging prototype

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-staging.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - run: npm ci
      - run: npx --no-install cap add android
      - run: ./gradlew --no-daemon assembleDebug
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: continuum-android-staging
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
