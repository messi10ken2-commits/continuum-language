name: Immersive companion preview
on:
  push:
    branches: ['codex/immersive-curriculum']
permissions:
  contents: read
concurrency:
  group: immersive-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  companion:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/qa-companion-3d.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: companion-3d-previews
          path: .media-build/immersive/*.png
          if-no-files-found: ignore
